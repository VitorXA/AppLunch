name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Troque por `npm ci` depois de commitar o package-lock.json.
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
